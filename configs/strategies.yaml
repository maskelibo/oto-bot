day_trader:
  fast_ma: 5
  slow_ma: 20
  atr_period: 14
  atr_multiplier_sl: 1.5
  atr_multiplier_tp: 2.5
  volume_filter: 1.2          # volume must be >= 1.2x average
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30

swing_trader:
  ma_short: 50
  ma_long: 200
  atr_period: 14
  atr_multiplier_sl: 2.0
  atr_multiplier_tp: 3.0
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9

scalper:
  lookback: 10
  z_entry: 1.0
  z_exit: 0.0
  bb_period: 20
  bb_std: 2.0
  atr_period: 14
  atr_multiplier_sl: 0.8
